# 8. DOCKER COMPOSE (FULL WORKING)

```yaml
services:

  postgres:
    image: postgres:15-alpine
    container_name: smart-dairy-db
    restart: unless-stopped

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: smart_dairy

    volumes:
      - postgres_data:/var/lib/postgresql/data


  nginx:
    image: nginx:alpine
    container_name: smart-dairy-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:

      # NGINX CONFIG
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      # IMAGE STORAGE (IMPORTANT)
      - ./public/images/uploads:/var/www/images/uploads

      # SSL
      - /etc/letsencrypt:/etc/letsencrypt:ro

      # ACME / verification
      - ./public/.well-known:/var/www/html/.well-known:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"


volumes:
  postgres_data:
```

---

# 9. NGINX CONFIG (FINAL FIXED VERSION)

```nginx
server {
    listen 80;
    server_name smartdairybd.com www.smartdairybd.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    server_name smartdairybd.com www.smartdairybd.com;

    ssl_certificate /etc/letsencrypt/live/smartdairybd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartdairybd.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;


    # =========================
    # STATIC IMAGES (IMPORTANT)
    # =========================
    location /images/uploads/ {

        alias /var/www/images/uploads/;

        # Browser cache (1 year)
        expires 1y;

        add_header Cache-Control "public, immutable";

        access_log off;

        autoindex off;

        try_files $uri =404;
    }


    # =========================
    # NEXT.JS APP
    # =========================
    location / {

        proxy_pass http://host.docker.internal:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
```

