# 14. COMMON ERRORS (FIXED)

| Problem             | Reason                      | Fix                           |
| ------------------- | --------------------------- | ----------------------------- |
| 404 image           | wrong DB path               | use `/images/uploads/...`     |
| image not loading   | wrong nginx alias           | fix `/var/www/images/uploads` |
| file disappears     | not mounted                 | fix docker volume             |
| works local only    | Next.js dev behavior        | use NGINX                     |
| broken after deploy | build-time misunderstanding | use runtime static server     |

---

# 15. FINAL RULES (MUST FOLLOW)

### Rule 1

Always store:

```txt
/images/uploads/file.jpg
```

---

### Rule 2

Never store server path.

---

### Rule 3

NGINX always serves:

```txt
/images/uploads/*
```

---

### Rule 4

Docker volume is mandatory:

```txt
./public/images/uploads:/var/www/images/uploads
```

