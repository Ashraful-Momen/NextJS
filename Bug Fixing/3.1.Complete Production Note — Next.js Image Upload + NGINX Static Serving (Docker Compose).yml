```txt
1. User uploads image
        ↓
2. Next.js saves file
        ↓
3. File stored in:
   public/images/uploads/
        ↓
4. DB stores:
   /images/uploads/cow.jpg
        ↓
5. Browser requests:
   https://domain.com/images/uploads/cow.jpg
        ↓
6. NGINX serves:
   /var/www/images/uploads/cow.jpg
```

